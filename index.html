<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuzzyMemory — Contextual Retrieval Engine</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 8px;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* HEADER */
    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      color: var(--primary);
      width: 32px;
      height: 32px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-sub);
    }

    /* PANELS */
    .panel {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin: 0;
    }

    .section-icon {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }

    /* INPUTS */
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    /* BUTTONS */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-record {
      background-color: var(--danger);
      color: white;
    }
    .btn-record:hover { background-color: #dc2626; }

    .btn-secondary {
      background-color: white;
      border: 1px solid #cbd5e1;
      color: #475569;
    }
    .btn-secondary:hover { background-color: #f1f5f9; }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* RESULTS */
    .result-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-top: 12px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .result-title { font-weight: 700; color: var(--text-main); }
    .result-meta { font-size: 0.85rem; color: var(--text-sub); }
    
    .match-badge {
      font-size: 0.75rem; 
      font-weight: 600; 
      color: var(--primary); 
      background: #eff6ff; 
      padding: 2px 8px; 
      border-radius: 99px;
    }

    .context-text {
      font-size: 0.9rem;
      color: #475569;
      margin: 8px 0;
      font-style: italic;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
      margin-right: 6px;
      margin-top: 4px;
    }

    a { color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.85rem; }
    a:hover { text-decoration: underline; }

    #status { font-weight: 600; color: var(--danger); font-size: 0.9rem; }
    .placeholder-text { color: #94a3b8; font-size: 0.9rem; margin-top: 10px; }
    
    input[type="file"] {
        font-size: 0.9rem;
        color: var(--text-sub);
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>
      <!-- Main Logo Icon -->
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
        <path d="M12 2a10 10 0 0 1 10 10"></path>
        <path d="M12 12L2.5 10"></path>
      </svg>
      FuzzyMemory
    </h1>
    <div class="subtitle">Universal Contextual Retrieval Engine powered by Google Vertex AI.</div>
  </header>

  <!-- 1. SEMANTIC SEARCH -->
  <section class="panel">
    <div class="panel-header">
      <!-- Brain Icon -->
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-4A2.5 2.5 0 0 1 9.5 2Z"></path>
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-4A2.5 2.5 0 0 0 14.5 2Z"></path>
      </svg>
      <h2 class="panel-title">Semantic Context Search</h2>
    </div>
    <label>Describe a scene, vibe, or quote</label>
    <textarea id="contextQuery" rows="2" placeholder="e.g. 'Who said the quote about freedom in the rain?' or 'Sad 90s song used in memes'"></textarea>
    <div class="btn-group">
      <button id="contextBtn" class="btn-primary">
        Run Context Search
      </button>
    </div>
    <div id="contextResults"></div>
  </section>

  <!-- 2. SIGNAL SEARCH -->
  <section class="panel">
    <div class="panel-header">
      <!-- Waveform Icon -->
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M17 5v14M7 5v14M2 10v4M22 10v4"></path>
      </svg>
      <h2 class="panel-title">Signal Recall (Audio)</h2>
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:20px; align-items:flex-end;">
        <div style="flex-grow:1;">
            <label>Metadata Text Search</label>
            <input id="textq" type="text" placeholder="Search by Title (e.g. Twinkle)">
        </div>
        <button id="searchBtn" class="btn-secondary" style="margin-top:0;">Search</button>
    </div>

    <label>Audio Input</label>
    <div class="btn-group">
      <button id="record" class="btn-record">Record Hum (5s)</button>
      <button id="stop" class="btn-secondary" disabled>Stop</button>
      <span id="status"></span>
    </div>
    
    <div id="results" class="placeholder-text">Results will appear here...</div>
  </section>

  <!-- 3. CREATOR TOOLS -->
  <section class="panel">
    <div class="panel-header">
      <!-- Shield Icon -->
      <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <h2 class="panel-title">Creator Compliance Tools</h2>
    </div>
    <label>Copyright & Plagiarism Check</label>
    <p style="font-size: 0.85rem; color: var(--text-sub); margin-top:4px;">Upload audio or check your last hum against the database.</p>
    
    <input type="file" id="fileInput" accept="audio/*">
    
    <div class="btn-group">
      <button id="checkBtn" class="btn-primary">Scan File</button>
      <button id="useLastBtn" class="btn-secondary">Use Last Hum</button>
    </div>
    <div id="creatorOut" class="result-item" style="min-height: 40px; display:flex; align-items:center; justify-content:center; color:#94a3b8;">
      Ready to scan.
    </div>
  </section>

</div>

<!-- LOGIC SCRIPT (UNCHANGED) -->
<script>
let mediaRecorder, audioChunks, lastSemis = null;
const RECORD_SECONDS = 5;
const FRAME_SIZE = 2048;
const HOP = 512;
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const contextResultsEl = document.getElementById('contextResults');
const creatorOut = document.getElementById('creatorOut');

document.getElementById('contextBtn').onclick = async () => {
  const q = document.getElementById('contextQuery').value.trim();
  if (!q) { contextResultsEl.innerText = 'Please enter a description.'; return; }
  contextResultsEl.innerHTML = '<div class="placeholder-text">Consulting Gemini AI...</div>';
  try {
    const resp = await fetch('/api/context', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query: q})});
    const json = await resp.json();
    if (!json.results || json.results.length === 0) { contextResultsEl.innerText = json.message || 'No context matches.'; return; }
    const html = json.results.map(r => {
      const derivs = (r.derivatives||[]).map(d => `<span class="tag"><b>${d.type}</b>: ${d.label}</span>`).join('');
      const ctxt = (r.context||[]).map(c => `<span style="font-size:12px; color:#64748b; margin-right:5px;">#${c}</span>`).join('');
      return `<div class="result-item">
                <div class="result-header">
                    <span class="result-title">${r.title}</span>
                    <span class="match-badge">Match: ${(r.context_score*100).toFixed(0)}%</span>
                </div>
                <div class="result-meta">${r.artist || ''}</div>
                <div class="context-text">"${r.context[0]}"</div>
                <div style="margin-bottom:8px;">${derivs}</div>
                <div><a href="${r.youtube_search}" target="_blank">▶ Listen on YouTube</a></div>
              </div>`;
    }).join('');
    contextResultsEl.innerHTML = html;
  } catch (e) {
    contextResultsEl.innerText = "Error connecting to server.";
  }
};

document.getElementById('searchBtn').onclick = async () => {
  const q = document.getElementById('textq').value;
  resultsEl.innerText = 'Searching...';
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const j = await r.json();
  renderMatches(j);
};

document.getElementById('record').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
  } catch (e) {
    resultsEl.innerText = 'Microphone access denied.';
    return;
  }
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = async () => {
    statusEl.innerText = 'Processing Signal...';
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const arr = await blob.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let audioBuffer;
    try { audioBuffer = await audioCtx.decodeAudioData(arr); }
    catch(e){ resultsEl.innerText = 'Decoding error.'; statusEl.innerText=''; return; }
    const channelData = audioBuffer.getChannelData(0);
    const sampleRate = audioBuffer.sampleRate;
    const freqs = [];
    const corrs = [];
    for (let i=0; i+FRAME_SIZE < channelData.length; i += HOP) {
      const frame = channelData.slice(i, i+FRAME_SIZE);
      const {f0,corr} = autoCorrelateWithCorr(frame, sampleRate);
      if (f0 && f0 > 60 && f0 < 1200 && corr > 0.22) { freqs.push(f0); corrs.push(corr); }
    }
    if (freqs.length < 3) { resultsEl.innerText = "⚠️ Signal too weak."; statusEl.innerText=''; return; }
    freqs.sort((a,b)=>a-b);
    const median = freqs[Math.floor(freqs.length/2)];
    const semis = freqs.map(f => 12 * Math.log2(f / median));
    const semisFiltered = semis.filter(s => Math.abs(s) < 18).map(s => Math.round(s));
    lastSemis = semisFiltered;
    const resp = await fetch('/api/hum', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({semitone_seq: semisFiltered})});
    const json = await resp.json();
    renderMatches(json);
    statusEl.innerText = '';
  };
  mediaRecorder.start();
  document.getElementById('record').disabled = true;
  document.getElementById('stop').disabled = false;
  statusEl.innerText = `Recording...`;
  setTimeout(()=>{ if (mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop(); }, RECORD_SECONDS*1000);
};

document.getElementById('stop').onclick = () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  document.getElementById('record').disabled = false;
  document.getElementById('stop').disabled = true;
};

function renderMatches(json){
  if (!json) { resultsEl.innerText = 'No response.'; return; }
  if (json.results) {
    if(json.results.length === 0) { resultsEl.innerText = 'No text matches found.'; return; }
    const html = json.results.map(m => {
       return `<div class="result-item">
                <div class="result-header"><span class="result-title">${m.title}</span></div>
                <div class="result-meta">${m.artist || 'Unknown'}</div>
                <div style="margin-top:5px;"><a href="${m.youtube_search}" target="_blank">▶ YouTube</a></div>
              </div>`;
    }).join('');
    resultsEl.innerHTML = html;
    return;
  }
  if (!json.matches || json.matches.length === 0) { resultsEl.innerText = json.message || 'No matches found.'; return; }
  const html = json.matches.map(m => {
    return `<div class="result-item">
              <div class="result-header">
                 <span class="result-title">${m.title}</span>
                 <span class="match-badge">Dist: ${m.distance.toFixed(2)}</span>
              </div>
              <div class="result-meta">${m.artist || 'Unknown'}</div>
              <div style="margin-top:5px;"><a href="${m.youtube_search}" target="_blank">▶ Listen on YouTube</a></div>
            </div>`;
  }).join('');
  resultsEl.innerHTML = html;
}

document.getElementById('useLastBtn').onclick = async () => {
  if (!lastSemis) { creatorOut.innerText = '⚠️ Please record a hum first.'; return; }
  await postCheck(lastSemis);
};

document.getElementById('checkBtn').onclick = async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) { creatorOut.innerText = '⚠️ Please choose an audio file.'; return; }
  creatorOut.innerText = 'Scanning...';
  const arr = await file.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let audioBuffer;
  try { audioBuffer = await audioCtx.decodeAudioData(arr); }
  catch(e){ creatorOut.innerText = 'Decoding error.'; return; }
  const channelData = audioBuffer.getChannelData(0);
  const freqs = [];
  for (let i=0; i+FRAME_SIZE < channelData.length; i += HOP) {
    const frame = channelData.slice(i, i+FRAME_SIZE);
    const {f0,corr} = autoCorrelateWithCorr(frame, audioBuffer.sampleRate);
    if (f0 && f0 > 60 && f0 < 1200 && corr > 0.22) freqs.push(f0);
  }
  if (freqs.length < 3) { creatorOut.innerText = 'Not enough pitched frames.'; return; }
  freqs.sort((a,b)=>a-b);
  const median = freqs[Math.floor(freqs.length/2)];
  const semis = freqs.map(f => 12 * Math.log2(f / median)).filter(s => Math.abs(s) < 18).map(s => Math.round(s));
  lastSemis = semis;
  await postCheck(semis);
};

async function postCheck(semiSeq){
  creatorOut.innerText = 'Checking Database...';
  const resp = await fetch('/api/check', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({semitone_seq: semiSeq})});
  const json = await resp.json();
  if (json.verdict) {
    let color = '#10b981'; 
    if (json.verdict.includes('High Risk')) color = '#ef4444';
    if (json.verdict.includes('Medium')) color = '#f59e0b';
    creatorOut.innerHTML = `<div style="color:${color}; font-weight:600; width:100%; text-align:center;">${json.verdict}</div>`;
  }
  else creatorOut.innerText = JSON.stringify(json, null, 2);
}

function autoCorrelateWithCorr(buf, sampleRate) {
  const size = buf.length;
  let rms = 0;
  for (let i = 0; i < size; i++) { let val = buf[i]; rms += val*val; }
  rms = Math.sqrt(rms/size);
  if (rms < 0.003) return {f0:null,corr:0};
  let bestOffset = -1;
  let bestCorr = 0;
  for (let offset = 20; offset < size/2; offset++) {
    let corr = 0;
    for (let i = 0; i < size - offset; i++) corr += buf[i] * buf[i + offset];
    corr = corr / (size - offset);
    if (corr > bestCorr) { bestCorr = corr; bestOffset = offset; }
  }
  if (bestOffset <= 0) return {f0:null, corr:0};
  const frequency = sampleRate / bestOffset;
  let energy = 0;
  for (let i=0;i<size;i++) energy += Math.abs(buf[i]);
  const normCorr = bestCorr / (energy/size + 1e-9);
  return {f0: frequency, corr: normCorr};
}
</script>
</body>
</html>
